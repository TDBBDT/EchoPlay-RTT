<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050"><defs><pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="9" stroke="#B74C43" stroke-width="2" opacity=".35"/></pattern><marker id="teal" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#258F97"/></marker><marker id="amber" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#C18B2A"/></marker><marker id="red" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#B74C43"/></marker><marker id="purple" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#87649D"/></marker><marker id="ink" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#243D38"/></marker></defs><rect width="100%" height="100%" fill="#F4F1E7"/><g font-family="Microsoft YaHei,SimHei,sans-serif" fill="#243D38"><text x="55.00" y="64.00" font-size="32" fill="#243D38" text-anchor="start" font-weight="700">08 / 从守卫关系到制作验证</text><text x="55.00" y="99.00" font-size="16" fill="#657670" text-anchor="start">借鉴 Mimimi 开发者公开分享后的本项目工作流；不是对其内部生产管线的逐项复刻</text><polyline points="55.00,120.00 1545.00,120.00" fill="none" stroke="#CDCFC3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="65.00" y="170.00" font-size="24" fill="#243D38" text-anchor="start" font-weight="700">拆解守卫关系：先解除观察者，再处理目标</text><rect x="70" y="205" width="430" height="185" rx="12" fill="#FFFEF9" stroke="#C9D0C4" stroke-width="1"/><rect x="70" y="205" width="8" height="185" rx="4" fill="#258F97" stroke="none" stroke-width="1"/><text x="93.00" y="237.00" font-size="14" fill="#258F97" text-anchor="start" font-weight="700">C / 空间绕行</text><text x="93.00" y="268.00" font-size="23" fill="#243D38" text-anchor="start" font-weight="700">C02 → C01暗杀区域</text><text x="93.00" y="300.00" font-size="17" fill="#657670" text-anchor="start">照壁切断这条观察关系</text><text x="93.00" y="326.00" font-size="17" fill="#657670" text-anchor="start">V2 后入 → C01 → V3 → 落石双杀</text><rect x="585" y="205" width="430" height="185" rx="12" fill="#FFFEF9" stroke="#C9D0C4" stroke-width="1"/><rect x="585" y="205" width="8" height="185" rx="4" fill="#C18B2A" stroke="none" stroke-width="1"/><text x="608.00" y="237.00" font-size="14" fill="#C18B2A" text-anchor="start" font-weight="700">D / 双人协作</text><text x="608.00" y="268.00" font-size="23" fill="#243D38" text-anchor="start" font-weight="700">D06 → D07取信区域</text><text x="608.00" y="300.00" font-size="17" fill="#657670" text-anchor="start">岚刃使观察者转头</text><text x="608.00" y="326.00" font-size="17" fill="#657670" text-anchor="start">苇音暗杀、藏尸、搜信</text><rect x="1100" y="205" width="430" height="185" rx="12" fill="#FFFEF9" stroke="#C9D0C4" stroke-width="1"/><rect x="1100" y="205" width="8" height="185" rx="4" fill="#258F97" stroke="none" stroke-width="1"/><text x="1123.00" y="237.00" font-size="14" fill="#258F97" text-anchor="start" font-weight="700">F / 分离双哨</text><text x="1123.00" y="268.00" font-size="23" fill="#243D38" text-anchor="start" font-weight="700">F01 ⇄ F02</text><text x="1123.00" y="300.00" font-size="17" fill="#657670" text-anchor="start">苇音把 F02 引到墙后</text><text x="1123.00" y="326.00" font-size="17" fill="#657670" text-anchor="start">岚刃处理失去照应的 F01</text><text x="65.00" y="459.00" font-size="24" fill="#243D38" text-anchor="start" font-weight="700">制作顺序：先证明空间关系，再增加美术细节</text><rect x="65" y="505" width="280" height="165" rx="12" fill="#FFFEF9" stroke="#C9D0C4" stroke-width="1"/><rect x="65" y="505" width="8" height="165" rx="4" fill="#258F97" stroke="none" stroke-width="1"/><text x="88.00" y="537.00" font-size="14" fill="#258F97" text-anchor="start" font-weight="700">01</text><text x="88.00" y="568.00" font-size="23" fill="#243D38" text-anchor="start" font-weight="700">机制试验场</text><text x="88.00" y="600.00" font-size="17" fill="#657670" text-anchor="start">标定视锥 / 声音 / 技能</text><text x="88.00" y="626.00" font-size="17" fill="#657670" text-anchor="start">测攀爬、跳点与恢复</text><polyline points="348.00,586.00 367.00,586.00" fill="none" stroke="#258F97" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/><rect x="369" y="505" width="280" height="165" rx="12" fill="#FFFEF9" stroke="#C9D0C4" stroke-width="1"/><rect x="369" y="505" width="8" height="165" rx="4" fill="#258F97" stroke="none" stroke-width="1"/><text x="392.00" y="537.00" font-size="14" fill="#258F97" text-anchor="start" font-weight="700">02</text><text x="392.00" y="568.00" font-size="23" fill="#243D38" text-anchor="start" font-weight="700">二维图与关系图</text><text x="392.00" y="600.00" font-size="17" fill="#657670" text-anchor="start">确定安全口袋和危险线</text><text x="392.00" y="626.00" font-size="17" fill="#657670" text-anchor="start">每个敌人写清存在理由</text><polyline points="652.00,586.00 671.00,586.00" fill="none" stroke="#258F97" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/><rect x="673" y="505" width="280" height="165" rx="12" fill="#FFFEF9" stroke="#C9D0C4" stroke-width="1"/><rect x="673" y="505" width="8" height="165" rx="4" fill="#258F97" stroke="none" stroke-width="1"/><text x="696.00" y="537.00" font-size="14" fill="#258F97" text-anchor="start" font-weight="700">03</text><text x="696.00" y="568.00" font-size="23" fill="#243D38" text-anchor="start" font-weight="700">无美术灰盒</text><text x="696.00" y="600.00" font-size="17" fill="#657670" text-anchor="start">先跑推荐解与替代解</text><text x="696.00" y="626.00" font-size="17" fill="#657670" text-anchor="start">覆盖巡逻整周期</text><polyline points="956.00,586.00 975.00,586.00" fill="none" stroke="#258F97" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/><rect x="977" y="505" width="280" height="165" rx="12" fill="#FFFEF9" stroke="#C9D0C4" stroke-width="1"/><rect x="977" y="505" width="8" height="165" rx="4" fill="#258F97" stroke="none" stroke-width="1"/><text x="1000.00" y="537.00" font-size="14" fill="#258F97" text-anchor="start" font-weight="700">04</text><text x="1000.00" y="568.00" font-size="23" fill="#243D38" text-anchor="start" font-weight="700">场景美术与镜头</text><text x="1000.00" y="600.00" font-size="17" fill="#657670" text-anchor="start">保留一至两个清晰视角</text><text x="1000.00" y="626.00" font-size="17" fill="#657670" text-anchor="start">功能面轮廓高于装饰</text><polyline points="1260.00,586.00 1279.00,586.00" fill="none" stroke="#258F97" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/><rect x="1281" y="505" width="280" height="165" rx="12" fill="#FFFEF9" stroke="#C9D0C4" stroke-width="1"/><rect x="1281" y="505" width="8" height="165" rx="4" fill="#258F97" stroke="none" stroke-width="1"/><text x="1304.00" y="537.00" font-size="14" fill="#258F97" text-anchor="start" font-weight="700">05</text><text x="1304.00" y="568.00" font-size="23" fill="#243D38" text-anchor="start" font-weight="700">盲测与回归</text><text x="1304.00" y="600.00" font-size="17" fill="#657670" text-anchor="start">记录首次理解与失败点</text><text x="1304.00" y="626.00" font-size="17" fill="#657670" text-anchor="start">调位后重跑全部解法</text><text x="65.00" y="735.00" font-size="25" fill="#243D38" text-anchor="start" font-weight="700">本次已交付：设计稿 + 定量图纸 + 美术概念 + 静态尺寸检查</text><text x="65.00" y="780.00" font-size="22" fill="#657670" text-anchor="start">进入引擎后验收：真实导航 / 角色碰撞 / 扫视时序 / 搜尸站立 / 相机遮挡 / 完整通关</text><rect x="65" y="835" width="1465" height="137" rx="12" fill="#E4E8DA" stroke="none" stroke-width="1"/><text x="95.00" y="880.00" font-size="22" fill="#243D38" text-anchor="start">“有解”必须落实为可复现的操作顺序、前置条件和失败恢复。</text><text x="95.00" y="923.00" font-size="22" fill="#243D38" text-anchor="start">预览图的红色只是危险信息编码；游戏实装仍用制作包规定的绿 / 黄 / 红状态反馈。</text></g></svg>