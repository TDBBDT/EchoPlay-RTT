00,856.00 260.00,874.50 519.00,874.50 519.00,819.00 519.00,700.60" fill="none" stroke="#258F97" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/><polyline points="519.00,634.00 556.00,634.00 778.00,560.00 778.00,486.00 852.00,375.00" fill="none" stroke="#258F97" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/><text x="630.00" y="338.00" font-size="16" fill="#258F97" text-anchor="start">→ 岔路：大门 / V1</text><text x="593.00" y="708.00" font-size="14" fill="#657670" text-anchor="start">岔路在本区外，见总图</text><circle cx="149" cy="856" r="8" fill="#FFFEF8" stroke="#258F97" stroke-width="3"/><text x="161.00" y="846.00" font-size="15" fill="#258F97" text-anchor="start" font-weight="700">CP_00</text><text x="149.00" y="338.00" font-size="17" fill="#243D38" text-anchor="start">默认镜头：先看到安全岩石，再看到敌人</text><circle cx="1030" cy="189" r="15" fill="#258F97" stroke="none" stroke-width="1"/><text x="1030.00" y="195.00" font-size="15" fill="white" text-anchor="middle" font-weight="700">1</text><text x="1056.00" y="195.00" font-size="17" fill="#243D38" text-anchor="start">石头形成硬遮挡，灌木只在蹲伏时隐藏。</text><text x="1056.00" y="221.00" font-size="17" fill="#243D38" text-anchor="start">先在 5–10 m 远区蹲行；</text><text x="1056.00" y="247.00" font-size="17" fill="#243D38" text-anchor="start">再从硬岩背面绕到敌人身后。</text><circle cx="1030" cy="334" r="15" fill="#258F97" stroke="none" stroke-width="1"/><text x="1030.00" y="340.00" font-size="15" fill="white" text-anchor="middle" font-weight="700">2</text><text x="1056.00" y="340.00" font-size="17" fill="#243D38" text-anchor="start">从 (12,3) 投向 (12,9)，射程恰好 6 m。</text><text x="1056.00" y="366.00" font-size="17" fill="#243D38" text-anchor="start">岚刃等守卫转向北，站立行走靠近；</text><text x="1056.00" y="392.00" font-size="17" fill="#243D38" text-anchor="start">从 (12,6.2) 接近背后执行暗杀。</text><circle cx="1030" cy="479" r="15" fill="#258F97" stroke="none" stroke-width="1"/><text x="1030.00" y="485.00" font-size="15" fill="white" text-anchor="middle" font-weight="700">3</text><text x="1056.00" y="485.00" font-size="17" fill="#243D38" text-anchor="start">站立走 3.2 m 约 1.45 秒，</text><text x="1056.00" y="511.00" font-size="17" fill="#243D38" text-anchor="start">在 2.5 秒转头窗口内开始暗杀。</text><text x="1056.00" y="537.00" font-size="17" fill="#243D38" text-anchor="start">杀死 A01 后保存 CP_01，开放跳跃段。</text><circle cx="1030" cy="624" r="15" fill="#258F97" stroke="none" stroke-width="1"/><text x="1030.00" y="630.00" font-size="15" fill="white" text-anchor="middle" font-weight="700">4</text><text x="1056.00" y="630.00" font-size="17" fill="#243D38" text-anchor="start">岔路处同时看见大门和 V1 垂藤。</text><text x="1056.00" y="656.00" font-size="17" fill="#243D38" text-anchor="start">大门只用于安全观察，不要求送死；</text><text x="1056.00" y="682.00" font-size="17" fill="#243D38" text-anchor="start">山谷风声替代战斗音乐，进入缓和段。</text><rect x="1020" y="790" width="345" height="235" rx="10" fill="#FFFCF3" stroke="#D0D1C6" stroke-width="1"/><text x="1040.00" y="820.00" font-size="20" fill="#243D38" text-anchor="start" font-weight="700">图例 / 同一时刻示意</text><polyline points="1040.00,855.00 1075.00,855.00" fill="none" stroke="#258F97" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="1086.00" y="861.00" font-size="15" fill="#243D38" text-anchor="start">青线：岚刃 / 主动线</text><polyline points="1040.00,887.00 1075.00,887.00" fill="none" stroke="#C18B2A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="1086.00" y="893.00" font-size="15" fill="#243D38" text-anchor="start">金线：苇音 / 诱导</text><polyline points="1040.00,919.00 1075.00,919.00" fill="none" stroke="#87649D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><text x="1086.00" y="925.00" font-size="15" fill="#243D38" text-anchor="start">紫虚线：巡逻路径</text><polyline points="1040.00,951.00 1075.00,951.00" fill="none" stroke="#B74C43" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="1086.00" y="957.00" font-size="15" fill="#243D38" text-anchor="start">红实填：近区；斜纹：远区</text><text x="1040.00" y="1001.00" font-size="14" fill="#657670" text-anchor="start">视锥为瞬时值；扫视与时序另见设计稿。</text></g></svg>