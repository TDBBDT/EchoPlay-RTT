<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1510" viewBox="0 0 2200 1510"><defs><pattern id="paving" width="32" height="26" patternUnits="userSpaceOnUse"><rect width="32" height="26" fill="#ded7c1"/><path d="M0 0H32V26H0Z M16 0V26" fill="none" stroke="#b8b59e" stroke-width=".5"/></pattern><pattern id="cliff" width="24" height="20" patternUnits="userSpaceOnUse"><rect width="24" height="20" fill="#839386"/><path d="M0 15L12 3L24 8M8 20L15 12" stroke="#718274" fill="none"/></pattern><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#278b8c"/></marker></defs><rect width="100%" height="100%" fill="#f5f1e7"/><g font-family="Microsoft YaHei,SimHei,sans-serif"><rect x="0" y="0" width="2200" height="133" rx="0" fill="#24463b" stroke="none"/><text x="55.00" y="47.00" font-size="16" fill="#c0cdb8" font-weight="400" text-anchor="start">ECHO PLAY  /  MOUNTAIN TEMPLE  /  ENVIRONMENT ART</text><text x="55.00" y="101.00" font-size="37" fill="#f7f3e8" font-weight="700" text-anchor="start">E  岩后整装 · 分区美术对照板</text><text x="2140.00" y="60.00" font-size="19" fill="#d8dbc4" font-weight="400" text-anchor="end">总纲 v2.0 · 补充图册 v1.0</text><text x="2140.00" y="99.00" font-size="19" fill="#d8dbc4" font-weight="400" text-anchor="end">世界原点 [70, 24, 0]  |  X东 / Z北 / H高程</text><rect x="55" y="165" width="1045" height="990" rx="14" fill="#fcfaf3" stroke="#d9dccc"/><text x="85.00" y="208.00" font-size="24" fill="#243f39" font-weight="700" text-anchor="start">01  正投影平面 / 北向固定</text><rect x="107.5" y="240.0" width="925.0" height="740.0" rx="0" fill="#e7e9d9" stroke="#b6c4b3"/><polyline points="107.50,980.00 107.50,240.00" fill="none" stroke="#cdd4c3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="107.50" y="1003.00" font-size="14" fill="#62776d" font-weight="400" text-anchor="middle">0</text><polyline points="570.00,980.00 570.00,240.00" fill="none" stroke="#cdd4c3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="570.00" y="1003.00" font-size="14" fill="#62776d" font-weight="400" text-anchor="middle">5</text><polyline points="1032.50,980.00 1032.50,240.00" fill="none" stroke="#cdd4c3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="1032.50" y="1003.00" font-size="14" fill="#62776d" font-weight="400" text-anchor="middle">10</text><polyline points="107.50,980.00 1032.50,980.00" fill="none" stroke="#cdd4c3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="97.50" y="985.00" font-size="14" fill="#62776d" font-weight="400" text-anchor="end">0</text><polyline points="107.50,517.50 1032.50,517.50" fill="none" stroke="#cdd4c3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="97.50" y="522.50" font-size="14" fill="#62776d" font-weight="400" text-anchor="end">5</text><rect x="107.5" y="240.0" width="925.0" height="740.0" rx="0" fill="#bccaad" stroke="#6e8173"/><polyline points="570.00,795.00 570.00,425.00" fill="none" stroke="#278b8c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="227.75" y="600.75" font-size="19" fill="#278b8c" font-weight="700" text-anchor="start">双人整装 / CP_04</text><text x="597.75" y="822.75" font-size="16" fill="#278b8c" font-weight="700" text-anchor="start">来D</text><text x="597.75" y="360.25" font-size="16" fill="#278b8c" font-weight="700" text-anchor="start">北口 → 西折至F</text><polyline points="107.50,610.00 1032.50,610.00" fill="none" stroke="#675f52" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="12 5 2 5"/><text x="112.50" y="602.00" font-size="17" fill="#675f52" font-weight="700" text-anchor="start">S</text><text x="1037.50" y="602.00" font-size="17" fill="#675f52" font-weight="700" text-anchor="start">S′</text><polyline points="1025.00,273.00 1025.00,238.00" fill="none" stroke="#243f39" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="1025.00" y="229.00" font-size="19" fill="#243f39" font-weight="700" text-anchor="middle">N</text><text x="86.00" y="1085.00" font-size="18" fill="#62776d" font-weight="400" text-anchor="start">青线：沿用教学路线片段  ·  红点：原守卫  ·  紫线：巡逻</text><text x="86.00" y="1117.00" font-size="18" fill="#62776d" font-weight="400" text-anchor="start">金色：高差 / 交互  ·  深绿：硬遮挡  ·  椭圆灌木：隐藏区</text><polyline points="107.50,1025.00 570.00,1025.00" fill="none" stroke="#243f39" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="107.50" y="1052.00" font-size="15" fill="#62776d" font-weight="400" text-anchor="start">5 m 比例尺；各图可缩放，坐标不缩放</text><rect x="1130" y="165" width="1015" height="535" rx="14" fill="#e9eddf" stroke="#d9dccc"/><text x="1160.00" y="207.00" font-size="24" fill="#243f39" font-weight="700" text-anchor="start">02  同源体块 / 从西南向东北看</text><polygon points="1599.89,575.62 1970.98,397.50 1970.98,456.88 1599.89,635.00" fill="#8d9b87" stroke="#6a7e6b" opacity="1"/><polygon points="1599.89,575.62 1303.02,433.12 1303.02,492.50 1599.89,635.00" fill="#a4ad96" stroke="#6a7e6b" opacity="1"/><polygon points="1599.89,575.62 1970.98,397.50 1674.11,255.00 1303.02,433.12" fill="#bccaad" stroke="#6a7e6b" opacity="1"/><text x="1160.00" y="668.00" font-size="17" fill="#62776d" font-weight="400" text-anchor="start">墙体暂按1.8m示意；高程采用原基准。体块不额外增加通路。</text><rect x="1130" y="725" width="1015" height="430" rx="14" fill="#fcfaf3" stroke="#d9dccc"/><text x="1160.00" y="766.00" font-size="24" fill="#243f39" font-weight="700" text-anchor="start">03  S—S′ 关键侧面 / 高程对照</text><polyline points="1425.00,1005.00 1825.00,1005.00" fill="none" stroke="#ccd4c6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/><text x="1413.00" y="1010.00" font-size="14" fill="#62776d" font-weight="400" text-anchor="end">H+0</text><polyline points="1425.00,885.00 1825.00,885.00" fill="none" stroke="#ccd4c6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/><text x="1413.00" y="890.00" font-size="14" fill="#62776d" font-weight="400" text-anchor="end">H+3</text><rect x="1425.0" y="1005" width="400" height="60.0" rx="0" fill="#c8c5ab" stroke="#718372"/><polyline points="1601.00,1005.00 1601.00,947.00" fill="none" stroke="#278b8c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1601.0" cy="939.0" r="6.800000000000001" fill="#278b8c" stroke="none"/><polyline points="1649.00,1005.00 1649.00,947.00" fill="none" stroke="#278b8c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1649.0" cy="939.0" r="6.800000000000001" fill="#278b8c" stroke="none"/><text x="1160.00" y="1093.00" font-size="17" fill="#62776d" font-weight="400" text-anchor="start">沿局部Z=4向北看；中央平面H0，双人尺度仅作参考。</text><text x="1160.00" y="1126.00" font-size="17" fill="#62776d" font-weight="400" text-anchor="start">示意人物高1.75m；材质起伏不得增加台阶或改变碰撞。</text><rect x="55" y="1185" width="685" height="185" rx="10" fill="#e4e8d9" stroke="none"/><text x="79.00" y="1226.00" font-size="23" fill="#278b8c" font-weight="700" text-anchor="start">01  轮廓</text><text x="79.00" y="1271.00" font-size="19" fill="#243f39" font-weight="400" text-anchor="start">小块裸岩安全平台；西缘岩背收景，北口透远景。</text><text x="79.00" y="1310.00" font-size="18" fill="#62776d" font-weight="400" text-anchor="start">仅用外围山体和低矮装饰围合，不增加房屋。</text><rect x="765" y="1185" width="685" height="185" rx="10" fill="#e4e8d9" stroke="none"/><text x="789.00" y="1226.00" font-size="23" fill="#278b8c" font-weight="700" text-anchor="start">02  功能</text><text x="789.00" y="1271.00" font-size="19" fill="#243f39" font-weight="400" text-anchor="start">中央保留双人停留面；没有敌人和新机关。</text><text x="789.00" y="1310.00" font-size="18" fill="#62776d" font-weight="400" text-anchor="start">三信核对、整装、CP_04；不新增资源拾取系统。</text><rect x="1475" y="1185" width="685" height="185" rx="10" fill="#e4e8d9" stroke="none"/><text x="1499.00" y="1226.00" font-size="23" fill="#278b8c" font-weight="700" text-anchor="start">03  衔接</text><text x="1499.00" y="1271.00" font-size="19" fill="#243f39" font-weight="400" text-anchor="start">入口世界(75,26,0)，出口(75,30,0)。</text><text x="1499.00" y="1310.00" font-size="18" fill="#62776d" font-weight="400" text-anchor="start">北到(75,33)后向西折返；F从西南(42,38)进入。</text><text x="55.00" y="1420.00" font-size="23" fill="#243f39" font-weight="700" text-anchor="start">锁定：区域原点、墙体足迹、敌人点位、藤蔓与跳点。建议：材质、背景建筑体量、植物与墙顶造型。</text><text x="55.00" y="1464.00" font-size="20" fill="#62776d" font-weight="400" text-anchor="start">平面与体块由既有坐标直接绘制；侧面为指定剖切线。美术细化后须复验导航、视线遮挡和摄像机。</text></g></svg>