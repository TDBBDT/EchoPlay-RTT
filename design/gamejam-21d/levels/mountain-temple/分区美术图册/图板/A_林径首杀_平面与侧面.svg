5" cy="344.20588235294116" rx="19.20955882352941" ry="10.477941176470587" fill="#a0b581" stroke="none"/><text x="1160.00" y="668.00" font-size="17" fill="#62776d" font-weight="400" text-anchor="start">墙体暂按1.8m示意；高程采用原基准。体块不额外增加通路。</text><rect x="1130" y="725" width="1015" height="430" rx="14" fill="#fcfaf3" stroke="#d9dccc"/><text x="1160.00" y="766.00" font-size="24" fill="#243f39" font-weight="700" text-anchor="start">03  S—S′ 关键侧面 / 高程对照</text><polyline points="1190.00,1005.00 2060.00,1005.00" fill="none" stroke="#ccd4c6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/><text x="1178.00" y="1010.00" font-size="14" fill="#62776d" font-weight="400" text-anchor="end">H+0</text><polyline points="1190.00,896.25 2060.00,896.25" fill="none" stroke="#ccd4c6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/><text x="1178.00" y="901.25" font-size="14" fill="#62776d" font-weight="400" text-anchor="end">H+3</text><rect x="1190.0" y="1005.0" width="870.0" height="54.375" rx="0" fill="#c8c5ab" stroke="#718372"/><rect x="1443.75" y="939.75" width="72.5" height="65.25" rx="0" fill="#6f836e" stroke="#718372"/><polyline points="1625.00,1005.00 1625.00,952.44" fill="none" stroke="#b65544" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1625.0" cy="945.1875" r="6.1625000000000005" fill="#b65544" stroke="none"/><polyline points="1545.25,1005.00 1545.25,939.75" fill="none" stroke="#b48135" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="1540.25,1005.00 1550.25,1005.00" fill="none" stroke="#b48135" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="1540.25,939.75 1550.25,939.75" fill="none" stroke="#b48135" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1554.25" y="978.38" font-size="16" fill="#b48135" font-weight="700" text-anchor="start">1.8m参考</text><text x="1160.00" y="1093.00" font-size="17" fill="#62776d" font-weight="400" text-anchor="start">沿局部Z=7向北看；A01与硬岩同一行走高程H0。</text><text x="1160.00" y="1126.00" font-size="17" fill="#62776d" font-weight="400" text-anchor="start">示意人物高1.75m；材质起伏不得增加台阶或改变碰撞。</text><rect x="55" y="1185" width="685" height="185" rx="10" fill="#e4e8d9" stroke="none"/><text x="79.00" y="1226.00" font-size="23" fill="#278b8c" font-weight="700" text-anchor="start">01  轮廓</text><text x="79.00" y="1271.00" font-size="19" fill="#243f39" font-weight="400" text-anchor="start">林间土路 + 两块硬岩；远处只露寺院檐线。</text><text x="79.00" y="1310.00" font-size="18" fill="#62776d" font-weight="400" text-anchor="start">树干、根系不侵入青色接近线。</text><rect x="765" y="1185" width="685" height="185" rx="10" fill="#e4e8d9" stroke="none"/><text x="789.00" y="1226.00" font-size="23" fill="#278b8c" font-weight="700" text-anchor="start">02  功能</text><text x="789.00" y="1271.00" font-size="19" fill="#243f39" font-weight="400" text-anchor="start">硬岩沿用两处原矩形，占位不能缩成矮石。</text><text x="789.00" y="1310.00" font-size="18" fill="#62776d" font-weight="400" text-anchor="start">A01面向西；首杀安全点保留在其南侧。</text><rect x="1475" y="1185" width="685" height="185" rx="10" fill="#e4e8d9" stroke="none"/><text x="1499.00" y="1226.00" font-size="23" fill="#278b8c" font-weight="700" text-anchor="start">03  衔接</text><text x="1499.00" y="1271.00" font-size="19" fill="#243f39" font-weight="400" text-anchor="start">出口局部(21,15) / 世界(26,−10,0)。</text><text x="1499.00" y="1310.00" font-size="18" fill="#62776d" font-weight="400" text-anchor="start">继续到世界(22,−6,0)岔路；不新开通庭院的路。</text><text x="55.00" y="1420.00" font-size="23" fill="#243f39" font-weight="700" text-anchor="start">锁定：区域原点、墙体足迹、敌人点位、藤蔓与跳点。建议：材质、背景建筑体量、植物与墙顶造型。</text><text x="55.00" y="1464.00" font-size="20" fill="#62776d" font-weight="400" text-anchor="start">平面与体块由既有坐标直接绘制；侧面为指定剖切线。美术细化后须复验导航、视线遮挡和摄像机。</text></g></svg>