点。</text><rect x="1475" y="1185" width="685" height="185" rx="10" fill="#e4e8d9" stroke="none"/><text x="1499.00" y="1226.00" font-size="23" fill="#278b8c" font-weight="700" text-anchor="start">03  衔接</text><text x="1499.00" y="1271.00" font-size="19" fill="#243f39" font-weight="400" text-anchor="start">V1=(20,2)；V2=(1.2,10)，各升降3m。</text><text x="1499.00" y="1310.00" font-size="18" fill="#62776d" font-weight="400" text-anchor="start">桥上H0，桥下净空2.2m；禁止上下层误接导航。</text><text x="55.00" y="1420.00" font-size="23" fill="#243f39" font-weight="700" text-anchor="start">锁定：区域原点、墙体足迹、敌人点位、藤蔓与跳点。建议：材质、背景建筑体量、植物与墙顶造型。</text><text x="55.00" y="1464.00" font-size="20" fill="#62776d" font-weight="400" text-anchor="start">平面与体块由既有坐标直接绘制；侧面为指定剖切线。美术细化后须复验导航、视线遮挡和摄像机。</text></g></svg>